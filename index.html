  <script>
    (function () {
      try {
        var stored = localStorage.getItem('ezskills.theme');
        var theme = (stored === 'light' || stored === 'dark')
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (err) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <style>
    :root {
      --paper: #f7f2e8;
      --paper-soft: #fffdf8;
      --surface: rgba(255, 253, 248, 0.86);
      --header-bg: rgba(247, 242, 232, 0.86);
      --ink: #151713;
      --muted: #5f665c;
      --line: rgba(21, 23, 19, 0.13);
      --line-strong: rgba(21, 23, 19, 0.24);
      --wash: rgba(21, 23, 19, 0.045);
      --emerald: #047a55;
      --emerald-soft: rgba(4, 122, 85, 0.09);
      --amber: #a95f14;
      --amber-soft: rgba(169, 95, 20, 0.1);
      --clay: #8f4d35;
      --clay-soft: rgba(143, 77, 53, 0.1);
      --grid-line: rgba(21, 23, 19, 0.035);
      --grid-emerald: rgba(4, 122, 85, 0.1);
      --shadow-soft: 0 1px 2px rgba(43, 36, 24, 0.05), 0 8px 24px rgba(43, 36, 24, 0.06);
      --shadow-lift: 0 2px 6px rgba(43, 36, 24, 0.06), 0 18px 40px rgba(43, 36, 24, 0.12);
      --btn-primary-bg: #151713;
      --btn-primary-fg: #fffdf8;
      --btn-primary-hover: #2a2d25;
      --radius: 10px;
      --radius-sm: 8px;
      --pill: 999px;
      --container: 1160px;
      --font-display: Georgia, "Times New Roman", "Songti SC", "Noto Serif SC", serif;
      --font-body: "Avenir Next", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      color-scheme: light;
    }

    [data-theme="dark"] {
      --paper: #12140f;
      --paper-soft: #1a1d16;
      --surface: rgba(26, 29, 22, 0.9);
      --header-bg: rgba(18, 20, 15, 0.86);
      --ink: #e8eae2;
      --muted: #9ba093;
      --line: rgba(232, 234, 226, 0.14);
      --line-strong: rgba(232, 234, 226, 0.28);
      --wash: rgba(232, 234, 226, 0.06);
      --emerald: #3fbb85;
      --emerald-soft: rgba(63, 187, 133, 0.14);
      --amber: #e0954a;
      --amber-soft: rgba(224, 149, 74, 0.14);
      --clay: #c98a6b;
      --clay-soft: rgba(201, 138, 107, 0.14);
      --grid-line: rgba(232, 234, 226, 0.045);
      --grid-emerald: rgba(63, 187, 133, 0.12);
      --shadow-soft: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.34);
      --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.34), 0 12px 32px rgba(0, 0, 0, 0.42);
      --btn-primary-bg: #e8eae2;
      --btn-primary-fg: #12140f;
      --btn-primary-hover: #f7f9f1;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
        radial-gradient(circle at 18% 0%, var(--grid-emerald), transparent 34%);
      background-size: 42px 42px, 42px 42px, auto, auto;
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a { color: inherit; text-decoration: none; }

    button, input, select, textarea { font: inherit; color: inherit; }

    button { cursor: pointer; }

    svg { display: block; }

    :focus-visible {
      outline: 2px solid var(--emerald);
      outline-offset: 2px;
    }

    ::selection {
      background: var(--emerald-soft);
      color: var(--ink);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .skip-link {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 200;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      background: var(--ink);
      color: var(--paper-soft);
      transform: translateY(-160%);
      transition: transform 160ms ease;
    }

    .skip-link:focus { transform: translateY(0); }

    /* ---------- header ---------- */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--header-bg);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .header-inner {
      max-width: var(--container);
      margin: 0 auto;
      padding: 12px 24px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: var(--radius-sm);
      background: var(--ink);
      color: var(--paper-soft);
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
    }

    .brand-mark.small {
      width: 30px;
      height: 30px;
      font-size: 16px;
    }

    .brand-text { display: flex; flex-direction: column; line-height: 1.15; }

    .brand-name {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      margin-top: 2px;
      font-family: var(--font-mono);
      font-size: 8.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .search-wrap { position: relative; min-width: 0; }

    .search-wrap > svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .search-wrap input {
      width: 100%;
      height: 40px;
      padding: 0 42px 0 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--paper-soft);
      font-size: 13.5px;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .search-wrap input::placeholder { color: var(--muted); opacity: 0.78; }

    .search-wrap input:focus {
      outline: none;
      border-color: var(--emerald);
      box-shadow: 0 0 0 3px var(--emerald-soft);
    }

    .search-wrap kbd {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--wash);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 10px;
    }

    .header-actions { display: flex; align-items: center; gap: 8px; }

    /* ---------- buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 36px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--paper-soft);
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .btn:hover { background: var(--wash); border-color: var(--line-strong); }
    .btn:active { transform: translateY(1px); }

    .btn-primary {
      background: var(--btn-primary-bg);
      border-color: var(--btn-primary-bg);
      color: var(--btn-primary-fg);
    }

    .btn-primary:hover {
      background: var(--btn-primary-hover);
      border-color: var(--btn-primary-hover);
      color: var(--btn-primary-fg);
    }

    .btn-danger { color: var(--clay); border-color: var(--clay-soft); }
    .btn-danger:hover { background: var(--clay); border-color: var(--clay); color: var(--paper-soft); }

    .btn-sm { height: 30px; padding: 0 10px; font-size: 11.5px; }

    .icon-btn {
      width: 36px;
      height: 36px;
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--paper-soft);
      color: var(--ink);
      transition: background-color 160ms ease, border-color 160ms ease;
    }

    .icon-btn:hover { background: var(--wash); border-color: var(--line-strong); }

    .text-btn {
      border: 0;
      padding: 0;
      background: none;
      color: var(--emerald);
      font-size: 12px;
      font-weight: 600;
    }

    .text-btn:hover { text-decoration: underline; text-underline-offset: 3px; }

    /* theme icons */
    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

    /* ---------- layout ---------- */
    .page {
      flex: 1;
      width: 100%;
      max-width: var(--container);
      margin: 0 auto;
      padding: 38px 24px 0;
    }

    .page-head { padding-bottom: 26px; }

    .eyebrow {
      margin: 0 0 10px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--clay);
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 44px;
      line-height: 1.05;
      letter-spacing: -0.02em;
      font-weight: 700;
    }

    .lede {
      max-width: 62ch;
      margin: 12px 0 0;
      font-size: 14.5px;
      line-height: 1.7;
      color: var(--muted);
    }

    /* ---------- stats ---------- */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      margin: 0 0 28px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      overflow: hidden;
    }

    .stat {
      padding: 15px 18px 14px;
      border-left: 1px solid var(--line);
    }

    .stat:first-child { border-left: 0; }

    .stat-value {
      display: block;
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      display: block;
      margin-top: 4px;
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stat[data-tone="emerald"] .stat-value { color: var(--emerald); }
    .stat[data-tone="amber"] .stat-value { color: var(--amber); }

    /* ---------- filters ---------- */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .chip-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .chip-row::-webkit-scrollbar { display: none; }

    .chip {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--pill);
      background: var(--surface);
      color: var(--ink);
      font-size: 12.5px;
      white-space: nowrap;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .chip:hover { border-color: var(--line-strong); background: var(--paper-soft); }

    .chip[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--paper-soft);
    }

    .chip-count {
      font-family: var(--font-mono);
      font-size: 10.5px;
      opacity: 0.55;
      font-variant-numeric: tabular-nums;
    }

    .chip[aria-pressed="true"] .chip-count { opacity: 0.72; }

    .tag-bar {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
    }

    .tag-label {
      flex: none;
      padding-top: 5px;
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      min-width: 0;
    }

    .tag {
      height: 26px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: var(--pill);
      background: transparent;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px;
      white-space: nowrap;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .tag:hover { border-color: var(--line-strong); color: var(--ink); }

    .tag[aria-pressed="true"] {
      border-color: var(--emerald);
      background: var(--emerald-soft);
      color: var(--emerald);
    }

    /* ---------- list head ---------- */
    .list-head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 26px 0 14px;
      flex-wrap: wrap;
    }

    .list-head h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .result-count {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    #clear-filters { margin-left: auto; }

    /* ---------- grid & cards ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper-soft);
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--line-strong);
      box-shadow: var(--shadow-lift);
    }

    .card:focus-visible { outline-offset: 3px; }

    .card.is-new { animation: card-in 1.6s ease-out; }

    @keyframes card-in {
      0% { box-shadow: 0 0 0 2px var(--emerald); }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    .card-top { display: flex; align-items: flex-start; gap: 12px; }

    .card-icon {
      width: 42px;
      height: 42px;
      flex: none;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--wash);
      font-size: 21px;
      line-height: 1;
    }

    .card-heading { flex: 1; min-width: 0; }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .card-name {
      flex: 1;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--font-mono);
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .status {
      flex: none;
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 8px;
      border: 1px solid transparent;
      border-radius: var(--pill);
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .status-idle { color: var(--muted); background: var(--wash); border-color: var(--line); }
    .status-learning { color: var(--amber); background: var(--amber-soft); border-color: var(--amber-soft); }
    .status-mastered { color: var(--emerald); background: var(--emerald-soft); border-color: var(--emerald-soft); }

    .card-desc {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.9em;
      margin: 12px 0 0;
      font-size: 12.8px;
      line-height: 1.55;
      color: var(--muted);
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
    }

    .tag-chip {
      padding: 2px 7px;
      border-radius: var(--pill);
      background: var(--wash);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 10px;
      line-height: 1.5;
    }

    .tag-chip.more { background: transparent; border: 1px dashed var(--line); }

    .progress-block { margin-top: auto; padding-top: 18px; }

    .progress-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      height: 6px;
      border-radius: var(--pill);
      background: var(--wash);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: var(--p, 0%);
      border-radius: var(--pill);
      background: var(--status-color, var(--emerald));
      transition: width 320ms ease;
    }

    .card[data-status="learning"] { --status-color: var(--amber); }
    .card[data-status="mastered"] { --status-color: var(--emerald); }
    .card[data-status="not-started"] { --status-color: var(--muted); }

    .card-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
    }

    .card-source {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 62%;
    }

    .card-uses { flex: none; font-variant-numeric: tabular-nums; }

    .empty {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 64px 20px;
      border: 1px dashed var(--line-strong);
      border-radius: 12px;
      text-align: center;
      color: var(--muted);
    }

    .empty strong { font-size: 14px; color: var(--ink); }
    .empty p { margin: 0; font-size: 12.5px; }

    /* ---------- footer ---------- */
    .site-footer {
      margin-top: 56px;
      border-top: 1px solid var(--line);
      background: var(--header-bg);
    }

    .footer-inner {
      max-width: var(--container);
      margin: 0 auto;
      padding: 24px 24px 40px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px 32px;
    }

    .footer-brand { display: flex; align-items: center; gap: 11px; min-width: 0; }

    .footer-name {
      margin: 0;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
    }

    .footer-note {
      margin: 2px 0 0;
      font-size: 11.5px;
      color: var(--muted);
    }

    .footer-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .footer-links {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }

    .footer-links a:hover { color: var(--emerald); }

    /* ---------- dialogs ---------- */
    html:has(dialog[open]) { overflow: hidden; }

    dialog {
      width: min(92vw, 560px);
      max-width: none;
      max-height: none;
      margin: auto;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
    }

    dialog::backdrop {
      background: rgba(10, 11, 8, 0.48);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }

    dialog.dialog-sm { width: min(92vw, 420px); }

    .dialog-card {
      max-height: 86vh;
      overflow: auto;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper-soft);
      box-shadow: var(--shadow-lift);
    }

    .dialog-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    #detail-title,
    .dialog-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.01em;
      overflow-wrap: anywhere;
    }

    #detail-title {
      font-family: var(--font-mono);
      font-size: 18px;
      letter-spacing: -0.01em;
    }

    .dialog-close { width: 30px; height: 30px; flex: none; }

    /* detail */
    .detail-hero {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 16px 0 0;
    }

    .detail-icon {
      width: 56px;
      height: 56px;
      flex: none;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--wash);
      font-size: 28px;
      line-height: 1;
    }

    .detail-heading { min-width: 0; }

    .detail-name {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      margin-top: 5px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--muted);
    }

    .detail-desc {
      margin: 14px 0 0;
      font-size: 13.5px;
      line-height: 1.7;
      color: var(--muted);
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
    }

    .detail-progress { margin: 20px 0 0; }

    .status-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 18px;
    }

    .status-btn {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .status-btn:hover { background: var(--wash); }

    .status-btn[aria-pressed="true"][data-status="not-started"] {
      border-color: var(--line-strong);
      background: var(--wash);
      color: var(--ink);
    }

    .status-btn[aria-pressed="true"][data-status="learning"] {
      border-color: var(--amber-soft);
      background: var(--amber-soft);
      color: var(--amber);
    }

    .status-btn[aria-pressed="true"][data-status="mastered"] {
      border-color: var(--emerald-soft);
      background: var(--emerald-soft);
      color: var(--emerald);
    }

    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .detail-actions .btn-primary { flex: 1; }

    .detail-link { width: 100%; margin-top: 8px; justify-content: space-between; }

    .detail-link span:last-child { font-family: var(--font-mono); font-size: 11px; opacity: 0.7; }

    /* form */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field.full { grid-column: 1 / -1; }

    .field label {
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .field .req { color: var(--clay); }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--paper);
      color: var(--ink);
      font-size: 13px;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .field textarea {
      height: 82px;
      padding: 9px 10px;
      line-height: 1.5;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--emerald);
      box-shadow: 0 0 0 3px var(--emerald-soft);
    }

    .field input::placeholder,
    .field textarea::placeholder { color: var(--muted); opacity: 0.7; }

    .form-error {
      margin: 12px 0 0;
      padding: 8px 10px;
      border: 1px solid var(--clay-soft);
      border-radius: var(--radius-sm);
      background: var(--clay-soft);
      color: var(--clay);
      font-size: 12px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .confirm-message {
      margin: 12px 0 0;
      font-size: 13px;
      line-height: 1.7;
      color: var(--muted);
    }

    /* ---------- toast ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: calc(100vw - 32px);
      padding: 11px 16px;
      border-radius: var(--pill);
      background: var(--ink);
      color: var(--paper);
      box-shadow: var(--shadow-lift);
      font-size: 12.5px;
      opacity: 0;
      transform: translate(-50%, 12px);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
      pointer-events: auto;
    }

    .toast button {
      flex: none;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ---------- responsive ---------- */
    @media (max-width: 720px) {
      .header-inner {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px 12px;
        padding: 10px 20px 12px;
      }

      .search-wrap { grid-column: 1 / -1; grid-row: 2; }

      .brand-sub { display: none; }

      .page { padding: 28px 20px 0; }

      h1 { font-size: 36px; }

      .lede { font-size: 13.5px; }

      .stats { grid-template-columns: 1fr 1fr; }

      .stat:nth-child(3) { border-left: 0; border-top: 1px solid var(--line); }
      .stat:nth-child(4) { border-top: 1px solid var(--line); }

      .tag-row {
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: none;
      }

      .tag-row::-webkit-scrollbar { display: none; }

      .grid { grid-template-columns: 1fr; }

      .footer-inner { grid-template-columns: 1fr; padding: 22px 20px 36px; }
      .footer-actions { order: 3; }

      .dialog-card { padding: 18px; }
      .form-grid { grid-template-columns: 1fr; }
      .detail-actions .btn-primary { flex: 1 1 100%; }
    }

    @media (max-width: 420px) {
      .header-actions .btn span { display: none; }
      .header-actions .btn { width: 36px; padding: 0; }
      .search-wrap kbd { display: none; }
      .search-wrap input { padding-right: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

        { id: '8', name: 'claude-code', category: 'ai-coding', source: 'anthropic', url: 'https://claude.ai', desc: 'Claude Code AI 编程助手', tags: ['ai', 'claude', 'coding'], status: 'mastered', progress: 100, uses: 128, icon: '🤖' },
        { id: '9', name: 'azure-ai', category: 'backend', source: 'skills.sh', url: 'https://skills.sh', desc: 'Azure AI 服务集成', tags: ['azure', 'ai', 'cloud'], status: 'not-started', progress: 0, uses: 0, icon: '☁️' },
        { id: '10', name: 'cursor-ide', category: 'ai-coding', source: 'cursor.sh', url: 'https://cursor.sh', desc: 'Cursor IDE 使用技巧', tags: ['cursor', 'ide', 'ai'], status: 'learning', progress: 80, uses: 45, icon: '💻' },
        { id: '11', name: 'docker-basics', category: 'backend', source: 'docker.com', url: 'https://docker.com', desc: 'Docker 容器基础', tags: ['docker', 'container', 'devops'], status: 'mastered', progress: 100, uses: 67, icon: '🐳' },
        { id: '12', name: 'git-workflow', category: 'tools', source: 'git-scm.com', url: 'https://git-scm.com', desc: 'Git 工作流最佳实践', tags: ['git', 'version-control'], status: 'mastered', progress: 100, uses: 89, icon: '🌿' }
      ];

      var state = {
        skills: [],
        category: 'all',
        tag: 'all',
        query: '',
        detailId: null,
        editingId: null
      };

      var loadWarning = '';

      /* ================= helpers ================= */
      function $(sel, root) { return (root || document).querySelector(sel); }

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
      }

      function normalizeUrl(value) {
        var raw = String(value == null ? '' : value).trim();
        if (!raw) return '';
        try {
          var url = new URL(raw);
          return (url.protocol === 'http:' || url.protocol === 'https:') ? url.href : '';
        } catch (err) {
          return '';
        }
      }

      function uid() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
        return 's-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
      }

      function clampProgress(value, fallback) {
        var n = Number(value);
        if (!isFinite(n)) n = fallback;
        return Math.max(0, Math.min(100, Math.round(n)));
      }

      function normalizeSkill(raw) {
        if (!raw || typeof raw !== 'object') return null;
        var status = STATUS[raw.status] ? raw.status : 'not-started';
        var fallbackProgress = status === 'mastered' ? 100 : (status === 'learning' ? 50 : 0);
        var tags = Array.isArray(raw.tags)
          ? raw.tags.map(function (t) { return String(t).trim().toLowerCase(); }).filter(Boolean)
          : [];
        tags = tags.filter(function (t, i) { return tags.indexOf(t) === i; }).slice(0, 8);
        var icon = Array.from(String(raw.icon || '📦')).slice(0, 4).join('') || '📦';
        var id = raw.id == null || raw.id === '' ? uid() : String(raw.id);
        var uses = Math.max(0, Math.floor(Number(raw.uses) || 0));
        return {
          id: id,
          name: String(raw.name == null ? '' : raw.name).trim().slice(0, 80) || '未命名技能',
          category: CATEGORY_NAMES[raw.category] ? raw.category : 'tools',
          source: String(raw.source == null ? '' : raw.source).trim().slice(0, 40) || 'custom',
          url: normalizeUrl(raw.url),
          desc: String(raw.desc == null ? '' : raw.desc).trim().slice(0, 300),
          tags: tags,
          status: status,
          progress: clampProgress(raw.progress, fallbackProgress),
          uses: uses,
          icon: icon,
          createdAt: typeof raw.createdAt === 'string' ? raw.createdAt : new Date().toISOString()
        };
      }

      function cloneDefaults() {
        return DEFAULT_SKILLS.map(function (s) {
          var copy = normalizeSkill(s);
          copy.id = s.id;
          return copy;
        });
      }

      function readStoredTheme() {
        try {
          var value = localStorage.getItem(THEME_KEY);
          return (value === 'light' || value === 'dark') ? value : '';
        } catch (err) {
          return '';
        }
      }

      function persist() {
        var payload = {
          version: 2,
          updatedAt: new Date().toISOString(),
          skills: state.skills
        };
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
          return true;
        } catch (err) {
          showToast('保存失败：浏览器本地存储不可用');
          return false;
        }
      }

      function loadSkills() {
        var list = null;
        var migrated = false;
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.skills)) list = parsed.skills;
          }
        } catch (err) {
          loadWarning = '本地数据读取失败，已载入示例数据';
        }

        if (!list) {
          try {
            var legacy = localStorage.getItem(LEGACY_KEY);
            if (legacy) {
              var legacyList = JSON.parse(legacy);
              if (Array.isArray(legacyList) && legacyList.length) {
                list = legacyList;
                migrated = true;
                if (!loadWarning) loadWarning = '已把旧版数据迁移到新格式';
              }
            }
          } catch (err) {
            loadWarning = '旧版本地数据已损坏，已载入示例数据';
          }
        }

        var skills = (list || []).map(normalizeSkill).filter(Boolean);
        if (!skills.length) skills = cloneDefaults();

        state.skills = skills;
        if (list && migrated) {
          var saved = persist();
          if (saved) {
            try { localStorage.removeItem(LEGACY_KEY); } catch (err) { /* ignore */ }
          }
        }
      }

      /* ================= theme ================= */
      var themeColorMeta = $('#theme-color');
      var themeToggle = $('#theme-toggle');

      function currentTheme() {
        return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      }

      function applyTheme(theme, persistChoice) {
        document.documentElement.setAttribute('data-theme', theme);
        if (themeColorMeta) themeColorMeta.setAttribute('content', theme === 'dark' ? '#12140f' : '#f7f2e8');
        if (themeToggle) {
          themeToggle.setAttribute('aria-label', theme === 'dark' ? '切换浅色模式' : '切换深色模式');
          themeToggle.setAttribute('title', theme === 'dark' ? '切换浅色模式' : '切换深色模式');
        }
        if (persistChoice) {
          try { localStorage.setItem(THEME_KEY, theme); } catch (err) { /* ignore */ }
        }
      }

      function initTheme() {
        var stored = readStoredTheme();
        var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(stored || (systemDark ? 'dark' : 'light'), false);

        if (themeToggle) {
          themeToggle.addEventListener('click', function () {
            applyTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
          });
        }

        if (window.matchMedia) {
          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          var onChange = function (event) {
            if (!readStoredTheme()) applyTheme(event.matches ? 'dark' : 'light', false);
          };
          if (typeof mq.addEventListener === 'function') mq.addEventListener('change', onChange);
          else if (typeof mq.addListener === 'function') mq.addListener(onChange);
        }
      }

      /* ================= toast ================= */
      var toast = $('#toast');
      var toastMessage = $('#toast-message');
      var toastAction = $('#toast-action');
      var toastTimer = null;

      function hideToast() {
        toast.classList.remove('show');
        toastAction.hidden = true;
        toastAction.onclick = null;
      }

      function showToast(message, actionLabel, action) {
        toastMessage.textContent = message;
        if (actionLabel && typeof action === 'function') {
          toastAction.hidden = false;
          toastAction.textContent = actionLabel;
          toastAction.onclick = function () {
            hideToast();
            action();
          };
        } else {
          toastAction.hidden = true;
          toastAction.onclick = null;
        }
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = window.setTimeout(hideToast, actionLabel ? 7000 : 2800);
      }

      /* ================= rendering ================= */
      var grid = $('#grid');
      var categoryChips = $('#category-chips');
      var tagChips = $('#tag-chips');
      var resultCount = $('#result-count');
      var clearFiltersBtn = $('#clear-filters');

      function findSkill(id) {
        var key = String(id);
        for (var i = 0; i < state.skills.length; i++) {
          if (String(state.skills[i].id) === key) return state.skills[i];
        }
        return null;
      }

      function skillIndex(id) {
        var key = String(id);
        for (var i = 0; i < state.skills.length; i++) {
          if (String(state.skills[i].id) === key) return i;
        }
        return -1;
      }

      function renderStats() {
        var mastered = 0;
        var learning = 0;
        var uses = 0;
        state.skills.forEach(function (s) {
          if (s.status === 'mastered') mastered++;
          if (s.status === 'learning') learning++;
          uses += s.uses;
        });
        $('#stat-total').textContent = String(state.skills.length);
        $('#stat-mastered').textContent = String(mastered);
        $('#stat-learning').textContent = String(learning);
        $('#stat-uses').textContent = String(uses);
      }

      function renderCategories() {
        var html = CATEGORIES.map(function (category) {
          var count = category.id === 'all'
            ? state.skills.length
            : state.skills.filter(function (s) { return s.category === category.id; }).length;
          var pressed = state.category === category.id ? 'true' : 'false';
          return '<button class="chip" type="button" data-category="' + category.id + '" aria-pressed="' + pressed + '">' +
            escapeHtml(category.name) + '<span class="chip-count">' + count + '</span></button>';
        }).join('');
        categoryChips.innerHTML = html;
      }

      function renderTags() {
        var counts = {};
        state.skills.forEach(function (s) {
          s.tags.forEach(function (tag) { counts[tag] = (counts[tag] || 0) + 1; });
        });
        var tags = Object.keys(counts).sort(function (a, b) {
          return counts[b] - counts[a] || a.localeCompare(b);
        });
        if (state.tag !== 'all' && tags.indexOf(state.tag) === -1) state.tag = 'all';
        tagChips.innerHTML = tags.map(function (tag) {
          var pressed = state.tag === tag ? 'true' : 'false';
          return '<button class="tag" type="button" data-tag="' + escapeHtml(tag) + '" aria-pressed="' + pressed + '">' +
            escapeHtml(tag) + '</button>';
        }).join('') || '<span class="result-count">暂无标签</span>';
      }

      function syncCategoryPressed() {
        var chips = categoryChips.querySelectorAll('[data-category]');
        for (var i = 0; i < chips.length; i++) {
          chips[i].setAttribute('aria-pressed', chips[i].getAttribute('data-category') === state.category ? 'true' : 'false');
        }
      }

      function syncTagPressed() {
        var tags = tagChips.querySelectorAll('[data-tag]');
        for (var i = 0; i < tags.length; i++) {
          tags[i].setAttribute('aria-pressed', tags[i].getAttribute('data-tag') === state.tag ? 'true' : 'false');
        }
      }

      function visibleSkills() {
        var query = state.query.trim().toLowerCase();
        return state.skills.filter(function (s) {
          if (state.category !== 'all' && s.category !== state.category) return false;
          if (state.tag !== 'all' && s.tags.indexOf(state.tag) === -1) return false;
          if (!query) return true;
          var haystack = [s.name, s.desc, s.source, s.tags.join(' ')].join(' ').toLowerCase();
          return haystack.indexOf(query) !== -1;
        });
      }

      function cardHtml(s) {
        var status = STATUS[s.status] || STATUS['not-started'];
        var tags = s.tags.slice(0, 3).map(function (tag) {
          return '<li class="tag-chip">' + escapeHtml(tag) + '</li>';
        });
        if (s.tags.length > 3) {
          tags.push('<li class="tag-chip more">+' + (s.tags.length - 3) + '</li>');
        }
        if (!tags.length) tags.push('<li class="tag-chip">无标签</li>');

        return '<article class="card" data-id="' + escapeHtml(s.id) + '" data-status="' + s.status + '" tabindex="0" role="button" aria-label="查看 ' + escapeHtml(s.name) + ' 详情">' +
          '<div class="card-top">' +
            '<span class="card-icon" aria-hidden="true">' + escapeHtml(s.icon) + '</span>' +
            '<div class="card-heading">' +
              '<div class="card-title-row">' +
                '<h3 class="card-name" title="' + escapeHtml(s.name) + '">' + escapeHtml(s.name) + '</h3>' +
                '<span class="status ' + status.className + '">' + status.label + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<p class="card-desc">' + (s.desc ? escapeHtml(s.desc) : '暂无描述') + '</p>' +
          '<ul class="card-tags">' + tags.join('') + '</ul>' +
          '<div class="progress-block">' +
            '<div class="progress-row"><span>进度</span><span>' + s.progress + '%</span></div>' +
            '<div class="progress-track" role="progressbar" aria-label="' + escapeHtml(s.name) + ' 学习进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + s.progress + '">' +
              '<div class="progress-fill" style="--p:' + s.progress + '%"></div>' +
            '</div>' +
          '</div>' +
          '<div class="card-meta">' +
            '<span class="card-source" title="' + escapeHtml(s.source) + '">' + escapeHtml(s.source) + '</span>' +
            '<span class="card-uses">使用 ' + s.uses + ' 次</span>' +
          '</div>' +
        '</article>';
      }

      function renderGrid() {
        var list = visibleSkills();
        var filtered = state.category !== 'all' || state.tag !== 'all' || state.query.trim() !== '';

        if (!state.skills.length) {
          grid.innerHTML = '<div class="empty">' +
            '<strong>还没有技能</strong>' +
            '<p>点击右上角「添加技能」，或者从备份文件导入。</p>' +
            '</div>';
        } else if (!list.length) {
          grid.innerHTML = '<div class="empty">' +
            '<strong>没有匹配的技能</strong>' +
            '<p>换个关键词，或者清除当前的分类 / 标签筛选。</p>' +
            '</div>';
        } else {
          grid.innerHTML = list.map(cardHtml).join('');
        }

        resultCount.textContent = filtered
          ? '显示 ' + list.length + ' / ' + state.skills.length + ' 个'
          : list.length + ' 个';
        clearFiltersBtn.hidden = !filtered;
      }

      function renderAll() {
        renderStats();
        renderCategories();
        renderTags();
        renderGrid();
      }

      function resetFilters() {
        state.category = 'all';
        state.tag = 'all';
        state.query = '';
        $('#search').value = '';
      }

      /* ================= detail ================= */
      var detailDialog = $('#detail-dialog');
      var detailTitle = $('#detail-title');
      var detailBody = $('#detail-body');

      function detailHtml(s) {
        var status = STATUS[s.status] || STATUS['not-started'];
        var tags = s.tags.length
          ? s.tags.map(function (tag) { return '<li class="tag-chip">' + escapeHtml(tag) + '</li>'; }).join('')
          : '<li class="tag-chip">无标签</li>';
        var statusButtons = Object.keys(STATUS).map(function (key) {
          var pressed = s.status === key ? 'true' : 'false';
          return '<button class="status-btn" type="button" data-action="status" data-status="' + key + '" aria-pressed="' + pressed + '">' +
            STATUS[key].label + '</button>';
        }).join('');
        var link = s.url
          ? '<a class="btn detail-link" href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener noreferrer">' +
              '<span>打开文档</span><span>' + escapeHtml(s.source) + ' ↗</span></a>'
          : '';

        return '<div class="detail-hero">' +
            '<span class="detail-icon" aria-hidden="true">' + escapeHtml(s.icon) + '</span>' +
            '<div class="detail-meta">' +
              '<span>' + escapeHtml(CATEGORY_NAMES[s.category] || s.category) + '</span>' +
              '<span>来源 ' + escapeHtml(s.source) + '</span>' +
              '<span>使用 ' + s.uses + ' 次</span>' +
            '</div>' +
          '</div>' +
          '<p class="detail-desc">' + (s.desc ? escapeHtml(s.desc) : '暂无描述') + '</p>' +
          '<ul class="detail-tags">' + tags + '</ul>' +
          '<div class="detail-progress">' +
            '<div class="progress-row"><span>进度</span><span>' + s.progress + '%</span></div>' +
            '<div class="progress-track" role="progressbar" aria-label="学习进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + s.progress + '">' +
              '<div class="progress-fill" style="--p:' + s.progress + '%;--status-color:' + statusColor(s.status) + '"></div>' +
            '</div>' +
          '</div>' +
          '<div class="status-group" role="group" aria-label="学习状态">' + statusButtons + '</div>' +
          '<div class="detail-actions">' +
            '<button class="btn btn-primary" type="button" data-action="use">+1 使用</button>' +
            '<button class="btn" type="button" data-action="edit">编辑</button>' +
            '<button class="btn btn-danger" type="button" data-action="delete">删除</button>' +
          '</div>' + link;
      }

      function statusColor(status) {
        if (status === 'mastered') return 'var(--emerald)';
        if (status === 'learning') return 'var(--amber)';
        return 'var(--muted)';
      }

      function openDetail(id) {
        var skill = findSkill(id);
        if (!skill) return;
        state.detailId = String(skill.id);
        detailTitle.textContent = skill.name;
        detailBody.innerHTML = detailHtml(skill);
        if (typeof detailDialog.showModal === 'function' && !detailDialog.open) {
          detailDialog.showModal();
        }
      }

      function closeDetail() {
        if (detailDialog.open) detailDialog.close();
      }

      function refreshDetail(focusSelector) {
        var skill = findSkill(state.detailId);
        if (!skill) { closeDetail(); return; }
        detailTitle.textContent = skill.name;
        detailBody.innerHTML = detailHtml(skill);
        if (focusSelector) {
          var target = detailBody.querySelector(focusSelector);
          if (target) target.focus();
        }
      }

      function setStatus(skill, status) {
        if (!STATUS[status] || skill.status === status) return false;
        skill.status = status;
        if (status === 'mastered') skill.progress = 100;
        else if (status === 'not-started') skill.progress = 0;
        else if (!(skill.progress > 0 && skill.progress < 100)) skill.progress = 50;
        return true;
      }

      /* ================= form ================= */
      var editDialog = $('#edit-dialog');
      var editForm = $('#edit-form');
      var editTitle = $('#edit-title');
      var editSubmit = $('#edit-submit');
      var formError = $('#form-error');
      var nameInput = $('#field-name');
      var urlInput = $('#field-url');

      function clearFormError() {
        formError.hidden = true;
        formError.textContent = '';
        nameInput.removeAttribute('aria-invalid');
        urlInput.removeAttribute('aria-invalid');
      }

      function openForm(skill) {
        clearFormError();
        state.editingId = skill ? String(skill.id) : null;
        editTitle.textContent = skill ? '编辑技能' : '添加技能';
        editSubmit.textContent = skill ? '保存修改' : '添加';
        editForm.reset();

        if (skill) {
          $('#field-name').value = skill.name;
          $('#field-category').value = skill.category;
          $('#field-status').value = skill.status;
          $('#field-source').value = skill.source === 'custom' ? '' : skill.source;
          $('#field-icon').value = skill.icon;
          $('#field-url').value = skill.url;
          $('#field-desc').value = skill.desc;
          $('#field-tags').value = skill.tags.join(' ');
        } else {
          $('#field-status').value = 'not-started';
        }

        closeDetail();
        if (!editDialog.open) editDialog.showModal();
        window.setTimeout(function () {
          nameInput.focus();
          if (skill) nameInput.select();
        }, 0);
      }

      function parseTags(value) {
        var seen = {};
        return String(value || '')
          .split(/[\s,，、]+/)
          .map(function (tag) { return tag.trim().toLowerCase(); })
          .filter(function (tag) {
            if (!tag || seen[tag]) return false;
            seen[tag] = true;
            return true;
          })
          .slice(0, 8);
      }

      /* ================= confirm ================= */
      var confirmDialog = $('#confirm-dialog');
      var confirmTitle = $('#confirm-title');
      var confirmMessage = $('#confirm-message');
      var confirmOk = $('#confirm-ok');
      var confirmResolver = null;

      function confirmAction(title, message, okLabel) {
        confirmTitle.textContent = title;
        confirmMessage.textContent = message;
        confirmOk.textContent = okLabel || '确认';
        confirmDialog.returnValue = '';
        return new Promise(function (resolve) {
          confirmResolver = resolve;
          if (!confirmDialog.open) confirmDialog.showModal();
        });
      }

      function settleConfirm(ok) {
        var resolver = confirmResolver;
        confirmResolver = null;
        if (confirmDialog.open) confirmDialog.close();
        if (resolver) resolver(ok);
      }

      /* ================= data actions ================= */
      function exportData() {
        var payload = {
          version: 2,
          exportedAt: new Date().toISOString(),
          skills: state.skills
        };
        var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = 'ezskills-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        showToast('已导出 ' + state.skills.length + ' 个技能');
      }

      function importData(file) {
        var reader = new FileReader();
        reader.onload = function () {
          var parsed;
          try {
            parsed = JSON.parse(String(reader.result));
          } catch (err) {
            showToast('导入失败：不是有效的 JSON 文件');
            return;
          }
          var rawList = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.skills) ? parsed.skills : null);
          if (!rawList) {
            showToast('导入失败：缺少 skills 数组');
            return;
          }
          var next = rawList.map(normalizeSkill).filter(Boolean);
          if (!next.length) {
            showToast('导入失败：没有可用的技能');
            return;
          }
          confirmAction('导入备份', '将用 ' + next.length + ' 个技能覆盖当前的 ' + state.skills.length + ' 个。建议先导出当前数据。', '覆盖导入')
            .then(function (ok) {
              if (!ok) return;
              state.skills = next;
              resetFilters();
              persist();
              renderAll();
              showToast('已导入 ' + next.length + ' 个技能');
            });
        };
        reader.onerror = function () { showToast('导入失败：文件读取错误'); };
        reader.readAsText(file);
      }

      function resetData() {
        confirmAction('恢复示例数据', '当前技能库将被 12 条示例数据替换，已添加和修改的内容会丢失。建议先导出备份。', '恢复示例')
          .then(function (ok) {
            if (!ok) return;
            state.skills = cloneDefaults();
            resetFilters();
            persist();
            renderAll();
            showToast('已恢复示例数据');
          });
      }

      /* ================= events ================= */
      function bindEvents() {
        categoryChips.addEventListener('click', function (event) {
          var button = event.target.closest('[data-category]');
          if (!button) return;
          state.category = button.getAttribute('data-category');
          syncCategoryPressed();
          renderGrid();
        });

        tagChips.addEventListener('click', function (event) {
          var button = event.target.closest('[data-tag]');
          if (!button) return;
          var tag = button.getAttribute('data-tag');
          state.tag = state.tag === tag ? 'all' : tag;
          syncTagPressed();
          renderGrid();
        });

        clearFiltersBtn.addEventListener('click', function () {
          resetFilters();
          syncCategoryPressed();
          syncTagPressed();
          renderGrid();
        });

        var searchInput = $('#search');
        searchInput.addEventListener('input', function () {
          state.query = searchInput.value;
          renderGrid();
        });

        searchInput.addEventListener('keydown', function (event) {
          if (event.key === 'Escape' && searchInput.value) {
            searchInput.value = '';
            state.query = '';
            renderGrid();
          }
        });

        grid.addEventListener('click', function (event) {
          var card = event.target.closest('.card');
          if (card) openDetail(card.getAttribute('data-id'));
        });

        grid.addEventListener('keydown', function (event) {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          var card = event.target.closest('.card');
          if (!card) return;
          event.preventDefault();
          openDetail(card.getAttribute('data-id'));
        });

        $('#add-btn').addEventListener('click', function () { openForm(null); });

        detailBody.addEventListener('click', function (event) {
          var button = event.target.closest('[data-action]');
          if (!button) return;
          var skill = findSkill(state.detailId);
          if (!skill) return;
          var action = button.getAttribute('data-action');

          if (action === 'status') {
            if (setStatus(skill, button.getAttribute('data-status'))) {
              persist();
              renderStats();
              renderGrid();
              refreshDetail('[data-action="status"][data-status="' + skill.status + '"]');
            }
          } else if (action === 'use') {
            skill.uses += 1;
            persist();
            renderStats();
            renderGrid();
            refreshDetail('[data-action="use"]');
          } else if (action === 'edit') {
            openForm(skill);
          } else if (action === 'delete') {
            var index = skillIndex(skill.id);
            var removed = skill;
            if (index === -1) return;
            state.skills.splice(index, 1);
            persist();
            closeDetail();
            renderAll();
            showToast('已删除「' + removed.name + '」', '撤销', function () {
              state.skills.splice(Math.min(index, state.skills.length), 0, removed);
              persist();
              renderAll();
              showToast('已恢复「' + removed.name + '」');
            });
          }
        });

        editForm.addEventListener('submit', function (event) {
          event.preventDefault();
          clearFormError();

          var name = nameInput.value.trim();
          if (!name) {
            formError.textContent = '请填写技能名称。';
            formError.hidden = false;
            nameInput.setAttribute('aria-invalid', 'true');
            nameInput.focus();
            return;
          }

          var rawUrl = urlInput.value.trim();
          var url = rawUrl ? normalizeUrl(rawUrl) : '';
          if (rawUrl && !url) {
            formError.textContent = '文档链接需要是 http:// 或 https:// 开头的地址。';
            formError.hidden = false;
            urlInput.setAttribute('aria-invalid', 'true');
            urlInput.focus();
            return;
          }

          var category = $('#field-category').value;
          var status = $('#field-status').value;
          var icon = Array.from($('#field-icon').value.trim() || '📦').slice(0, 4).join('') || '📦';
          var source = $('#field-source').value.trim() || 'custom';
          var desc = $('#field-desc').value.trim();
          var tags = parseTags($('#field-tags').value);
          var existing = state.editingId ? findSkill(state.editingId) : null;

          if (existing) {
            var previousStatus = existing.status;
            existing.name = name;
            existing.category = category;
            existing.status = STATUS[status] ? status : 'not-started';
            existing.source = source;
            existing.url = url;
            existing.desc = desc;
            existing.tags = tags;
            existing.icon = icon;
            if (existing.status !== previousStatus) {
              if (existing.status === 'mastered') existing.progress = 100;
              else if (existing.status === 'not-started') existing.progress = 0;
              else if (!(existing.progress > 0 && existing.progress < 100)) existing.progress = 50;
            }
          } else {
            var created = normalizeSkill({
              id: uid(),
              name: name,
              category: category,
              status: status,
              source: source,
              url: url,
              desc: desc,
              tags: tags,
              icon: icon,
              progress: status === 'mastered' ? 100 : (status === 'learning' ? 50 : 0),
              uses: 0,
              createdAt: new Date().toISOString()
            });
            state.skills.unshift(created);
            state.editingId = created.id;
          }

          var savedId = state.editingId;
          persist();
          resetFilters();
          renderAll();
          editDialog.close();
          showToast(existing ? '已保存修改' : '已添加「' + name + '」');
          state.editingId = null;

          if (existing) {
            openDetail(savedId);
          } else {
            var card = null;
            var cards = grid.querySelectorAll('.card');
            for (var i = 0; i < cards.length; i++) {
              if (cards[i].getAttribute('data-id') === String(savedId)) { card = cards[i]; break; }
            }
            if (card) {
              card.classList.add('is-new');
              card.scrollIntoView({ block: 'center', behavior: 'smooth' });
              card.focus({ preventScroll: true });
            }
          }
        });

        editForm.addEventListener('input', function (event) {
          if (event.target === nameInput) nameInput.removeAttribute('aria-invalid');
          if (event.target === urlInput) urlInput.removeAttribute('aria-invalid');
        });

        document.querySelectorAll('[data-close]').forEach(function (button) {
          button.addEventListener('click', function () {
            var dialog = button.closest('dialog');
            if (dialog) dialog.close();
          });
        });

        detailDialog.addEventListener('click', function (event) {
          if (event.target === detailDialog) detailDialog.close();
        });
        editDialog.addEventListener('click', function (event) {
          if (event.target === editDialog) editDialog.close();
        });
        confirmDialog.addEventListener('click', function (event) {
          if (event.target === confirmDialog) settleConfirm(false);
        });

        confirmDialog.addEventListener('cancel', function (event) {
          event.preventDefault();
          settleConfirm(false);
        });

        confirmDialog.querySelectorAll('[data-confirm]').forEach(function (button) {
          button.addEventListener('click', function () {
            settleConfirm(button.getAttribute('data-confirm') === 'ok');
          });
        });

        document.querySelectorAll('[data-data-action]').forEach(function (button) {
          button.addEventListener('click', function () {
            var action = button.getAttribute('data-data-action');
            if (action === 'export') exportData();
            else if (action === 'reset') resetData();
            else if (action === 'import') $('#import-file').click();
          });
        });

        $('#import-file').addEventListener('change', function (event) {
          var file = event.target.files && event.target.files[0];
          if (file) importData(file);
          event.target.value = '';
        });

        document.addEventListener('keydown', function (event) {
          if (event.key !== '/' || event.metaKey || event.ctrlKey || event.altKey) return;
          if (document.querySelector('dialog[open]')) return;
          var target = event.target;
          var tagName = target && target.tagName ? target.tagName : '';
          if (tagName === 'INPUT' || tagName === 'TEXTAREA' || tagName === 'SELECT' || (target && target.isContentEditable)) return;
          event.preventDefault();
          searchInput.focus();
        });
      }

      /* ================= init ================= */
      function init() {
        initTheme();
        loadSkills();
        bindEvents();
        renderAll();
        if (loadWarning) showToast(loadWarning);
      }

      init();
    })();
  </script>
</body>
</html>
